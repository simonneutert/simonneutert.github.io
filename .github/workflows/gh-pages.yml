name: Deploy to GitHub pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: deno run -A jsr:@simonneutert/quickblog build # pin the version of quickblog to avoid breaking changes

      - name: Check links
        run: deno run -R --allow-run=git jsr:@simonneutert/md-links-checker@0.2.0 --root dist posts pages index.md

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
